body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

padding:16px 20px;margin-bottom:14px;}

.scorebar{position:sticky;top:0;z-index:5;background:var(--dark);border:1px solid var(--card);

align-items:center;font-size:13px;}
.scorebar b{color:var(--lgreen);}

border-left:4px solid var(--green);}

cursor:pointer;transition:.12s;}
.opt:hover:not(.locked){border-color:var(--green);}

.opt.correct{background:rgba(118,185,0,.18);border-color:var(--green);}
.opt.correct .lab{color:var(--green);}

.opt.wrong .lab{color:var(--red);}

border-radius:6px;padding:8px 11px;margin-top:8px;border-left:3px solid var(--lgreen);}

margin-top:8px;border:2px solid var(--green);}

font-size:14px;font-weight:700;cursor:pointer;}
.btn:hover{background:var(--lgreen);}

<script>
const QUIZ = {"module": "01", "title": "Machine Learning Fundamentals", "questions": [{"q": "Rekanmu menyaring spam dengan daftar aturan if/else: 'ada kata GRATIS', 'banyak huruf kapital'. Apa yang membedakan pendekatan machine learning dari cara ini?", "code": null, "options": ["Aturannya sama persis, hanya ditulis ulang dalam Python supaya lebih rapi dan cepat", "Polanya dipelajari dari ribuan contoh email berlabel, bukan ditulis tangan satu per satu", "Tidak butuh data sama sekali, cukup definisi spam yang jelas dari pemilik produk", "Baru bisa dipakai kalau daftar aturannya sudah lengkap dan diuji oleh manusia dulu"], "answer": 1, "explanation": "Inti ML: aturan dipelajari dari contoh berlabel, bukan ditulis satu per satu oleh programmer."}, {"q": "Seorang peserta mengukur akurasi model pada data yang sama dengan data latihnya, hasilnya 99%. Apa masalahnya?", "code": null, "options": ["Angka itu tidak menunjukkan kemampuan pada data baru; model bisa saja menghafal data train", "Tidak ada masalah; 99% pada data mana pun sudah cukup untuk menyatakan model layak dipakai", "Akurasi bukan metrik yang sah untuk klasifikasi, seharusnya selalu memakai R² atau MAE", "Data train seharusnya lebih kecil dari data test supaya angkanya tidak terlalu tinggi"], "answer": 0, "explanation": "Skor di data train hanya menunjukkan seberapa baik model mengikuti data yang sudah dilihat. Generalisasi diukur di data test yang terpisah."}, {"q": "Kamu memprediksi apakah nasabah akan membuka deposito sebelum bank meneleponnya. Di data ada kolom 'lama panggilan'. Mengapa kolom ini berbahaya kalau ikut dipakai?", "code": null, "options": ["Satuannya detik, padahal kolom lain memakai menit, sehingga skalanya tidak sebanding", "Kolom numerik tidak boleh dicampur dengan kolom kategori dalam satu model klasifikasi", "Nilainya baru lengkap setelah panggilan berakhir, padahal prediksi dibutuhkan sebelum menelepon", "Kolom itu berkorelasi dengan umur nasabah sehingga membuat model menjadi bias usia"], "answer": 2, "explanation": "Ini leakage: model memakai informasi yang belum tersedia saat prediksi dibutuhkan, sehingga evaluasinya terlalu optimistis."}, {"q": "Kapan scaling (menyamakan rentang nilai feature) benar-benar mengubah hasil model?", "code": null, "options": ["Pada semua model tanpa kecuali, karena algoritma apa pun bekerja lebih baik dengan angka kecil", "Hanya pada decision tree, karena ambang pemisahnya dihitung dari nilai yang sudah diskalakan", "Tidak pernah; scaling hanya kebiasaan lama yang dipertahankan supaya kode terlihat rapi", "Pada model berbasis jarak seperti KNN dan SVM; decision tree tidak terpengaruh skala"], "answer": 3, "explanation": "Model yang menghitung jarak atau kombinasi linear peka terhadap skala. Tree membandingkan nilai dengan ambang per feature, jadi skala tidak mengubah hasil."}, {"q": "Skor model di data train sangat tinggi, di data validation jauh lebih rendah. Kondisi apa ini dan langkah apa yang masuk akal?", "code": null, "options": ["Underfitting; tambah kompleksitas model atau tambah feature supaya polanya tertangkap", "Overfitting; kurangi kompleksitas model, tambah data, atau pakai regularisasi", "Leakage; buang data validation dan ukur ulang langsung di data test yang tersisa", "Kondisi normal; laporkan skor train karena itu yang mencerminkan kemampuan model"], "answer": 1, "explanation": "Gap besar train vs validation adalah tanda overfitting: model mengikuti detail dan noise data train."}, {"q": "Kamu memilih kedalaman decision tree terbaik dari 1 sampai 15. Cara mana yang tidak mencemari penilaian akhir?", "code": null, "options": ["Coba semua kedalaman, pilih skor tertinggi di data test, lalu laporkan skor test yang sama", "Pilih kedalaman terbesar, karena pohon yang lebih dalam selalu menangkap pola lebih lengkap", "Pilih dengan cross-validation di data train, lalu ukur sekali di data test di akhir", "Pilih kedalaman 1 supaya cepat, karena kedalaman hampir tidak mempengaruhi hasil"], "answer": 2, "explanation": "Kalau data test dipakai untuk memilih, skor test jadi terlalu optimistis. Cross-validation di data train menjaga test tetap 'baru'."}, {"q": "Model memprediksi 'tidak beli' untuk semua orang dan akurasinya 89%. Apa yang bisa disimpulkan?", "code": null, "options": ["Belum tentu bagus: 89% mungkin sama dengan baseline kelas mayoritas, model belum menambah apa pun", "Model sudah bagus karena akurasi di atas 80% umumnya dianggap layak untuk produksi", "Model perlu lebih banyak feature numerik supaya akurasinya bisa naik melewati 90%", "Model terlalu rumit dan perlu disederhanakan supaya tidak menghafal data latihnya"], "answer": 0, "explanation": "Baseline kelas mayoritas adalah pembanding minimal. Kalau model tidak melampauinya, akurasi tinggi itu kosong."}, {"q": "Nilai R² sebuah model regresi adalah 0. Apa artinya?", "code": null, "options": ["Model sempurna, karena error kuadratnya nol pada semua baris data evaluasi", "Semua prediksi model bernilai nol karena koefisiennya belum dilatih dengan benar", "Target di data evaluasi tidak punya variasi sehingga metriknya tidak bisa dihitung", "Model tidak lebih baik daripada selalu memprediksi rata-rata target di data evaluasi"], "answer": 3, "explanation": "R² membandingkan error model dengan error prediksi rata-rata: 1 = sempurna, 0 = sama dengan rata-rata, negatif = lebih buruk."}, {"q": "Pada model harga rumah ŷ = 2,5·luas + 50, apa arti angka 2,5?", "code": null, "options": ["Harga rumah paling murah yang ada di data train setelah dibagi seratus", "Jumlah rumah rata-rata per kelurahan yang dipakai untuk melatih model", "Setiap tambahan satu satuan luas menaikkan prediksi harga sebesar 2,5", "Error rata-rata prediksi model pada data test dalam satuan harga"], "answer": 2, "explanation": "Koefisien (kemiringan) menyatakan perubahan prediksi per satu satuan feature. 50 adalah intercept, prediksi saat luas = 0."}, {"q": "Model A dan B punya MAE sama, tetapi RMSE model A jauh lebih besar. Apa yang bisa disimpulkan tentang model A?", "code": null, "options": ["Model A lebih akurat karena RMSE yang besar menandakan model menangkap variasi data", "Model A punya beberapa error sangat besar, karena RMSE menghukum error besar lewat kuadrat", "Model A memakai lebih banyak feature sehingga metriknya dihitung dengan cara berbeda", "Kedua model identik; perbedaan RMSE hanya efek pembulatan saat mencetak hasil"], "answer": 1, "explanation": "RMSE mengkuadratkan error sebelum dirata-rata, sehingga beberapa kesalahan besar membuatnya melonjak meski MAE sama."}, {"q": "Setelah Lasso (regularisasi L1) dipakai, koefisien kolom 'iklan koran' menjadi tepat nol. Apa maknanya?", "code": null, "options": ["Kolom itu berisi nilai nol di semua baris sehingga tidak mungkin punya koefisien", "Model gagal dilatih karena alpha terlalu kecil dan perlu dilatih ulang dari awal", "Kolom itu paling penting, dan nol menandakan model sudah yakin sepenuhnya padanya", "Lasso menilai kolom itu tidak cukup membantu dibanding penaltinya, jadi dibuang dari model"], "answer": 3, "explanation": "Penalti L1 mendorong koefisien yang kontribusinya kecil ke nol, sehingga Lasso sekaligus menyeleksi feature."}, {"q": "Kamu membagi data penjualan bulanan untuk evaluasi model time series. Cara split mana yang benar?", "code": null, "options": ["Kronologis: latih di bulan-bulan awal, uji di 12 bulan terakhir yang belum dilihat", "Acak 80/20 seperti data tabular biasa supaya distribusi train dan test seimbang", "Uji di bulan-bulan awal dan latih di bulan-bulan akhir supaya model belajar tren terbaru", "Tidak perlu split; model time series dievaluasi cukup dari seberapa halus kurvanya"], "answer": 0, "explanation": "Urutan waktu penting. Mengacak data membuat model 'melihat masa depan' saat dilatih."}, {"q": "Model SARIMA kamu punya MAPE 6%. Sebelum bangga, pembanding apa yang paling wajar dicek?", "code": null, "options": ["Akurasi model klasifikasi pada data yang sama supaya ada angka kedua untuk dibandingkan", "Baseline seasonal naive: tebak bulan ini sama dengan bulan yang sama tahun lalu", "R² dari linear regression sederhana terhadap nomor urut bulan sebagai satu-satunya feature", "Tidak perlu pembanding; MAPE di bawah 10% sudah pasti berarti model layak dipakai"], "answer": 1, "explanation": "Untuk data musiman, seasonal naive sering sudah cukup bagus. Model layak kalau mengalahkannya."}, {"q": "Logistic regression memberi probabilitas 0,62 untuk seorang nasabah. Dengan threshold 0,5 prediksinya apa, dan apa yang terjadi kalau threshold dinaikkan ke 0,7?", "code": null, "options": ["Ya; tetap Ya, karena probabilitas 0,62 tidak berubah saat threshold digeser", "Tidak; menjadi Ya, karena threshold yang lebih tinggi membuat model lebih longgar", "Ya; menjadi Tidak, karena 0,62 berada di bawah threshold baru 0,7", "Tidak bisa ditentukan tanpa melihat akurasi model pada seluruh data test"], "answer": 2, "explanation": "Threshold mengubah probabilitas menjadi kelas. Menaikkan threshold membuat model lebih jarang bilang 'Ya': precision naik, recall turun."}, {"q": "Di sistem deteksi penipuan kartu kredit, kesalahan mana yang biasanya paling mahal, dan metrik mana yang menyorotnya?", "code": null, "options": ["False negative, karena penipuan yang lolos adalah kerugian langsung; metriknya recall", "False positive, karena transaksi sah yang tertahan membuat nasabah kesal; metriknya precision", "True negative, karena transaksi normal yang terlalu banyak menurunkan akurasi", "True positive, karena setiap penipuan yang tertangkap harus diverifikasi manual; metriknya F1"], "answer": 0, "explanation": "Penipuan yang tidak tertangkap (false negative) adalah kerugian langsung. Recall mengukur berapa banyak kasus positif yang tertangkap."}, {"q": "Mengapa F1 memakai rata-rata harmonik precision dan recall, bukan rata-rata biasa?", "code": null, "options": ["Karena rata-rata harmonik lebih mudah dihitung oleh library dan hasilnya selalu lebih besar", "Karena precision dan recall selalu bernilai sama sehingga jenis rata-ratanya tidak penting", "Karena rata-rata biasa hanya berlaku untuk metrik regresi seperti MAE dan RMSE", "Karena rata-rata harmonik menghukum ketidakseimbangan: precision tinggi tidak menutupi recall rendah"], "answer": 3, "explanation": "Rata-rata harmonik condong ke nilai yang lebih kecil, jadi F1 tinggi hanya kalau keduanya tinggi."}, {"q": "Pada plot dua feature (umur dan gaji), batas keputusan sebuah model hanya terdiri dari garis horizontal dan vertikal. Model apa yang paling mungkin?", "code": null, "options": ["KNN, karena tetangga terdekat dikelompokkan dalam kotak-kotak berukuran sama", "SVM kernel RBF, karena kernel membuat batas tegak lurus pada tiap sumbu feature", "Decision tree, karena tiap simpul membandingkan satu feature dengan satu ambang", "Logistic regression, karena koefisiennya memisahkan tiap feature secara terpisah"], "answer": 2, "explanation": "Setiap simpul decision tree memecah data berdasarkan satu feature, sehingga batasnya sejajar sumbu feature."}, {"q": "KNN dengan K=1: akurasi train 100%, akurasi CV rendah. KNN dengan K=99: akurasi train dan CV sama-sama rendah. Apa yang terjadi?", "code": null, "options": ["K=1 underfit karena terlalu sedikit tetangga; K=99 overfit karena terlalu banyak yang dihitung", "K=1 overfit karena mengikuti tiap titik; K=99 underfit karena batasnya terlalu rata", "Keduanya overfit; jumlah tetangga tidak mempengaruhi kompleksitas batas keputusan", "Keduanya sudah optimal; selisih train dan CV adalah hal wajar untuk model berbasis jarak"], "answer": 1, "explanation": "K kecil membuat prediksi mengikuti noise; K besar merata-ratakan terlalu banyak tetangga sehingga pola lokal hilang."}, {"q": "Kamu memakai KNN pada kolom umur (18–60) dan gaji (15.000–150.000) tanpa scaling. Apa akibatnya?", "code": null, "options": ["Jarak didominasi selisih gaji; umur hampir tidak berpengaruh pada tetangga yang terpilih", "Tidak ada; KNN menghitung jarak per feature secara terpisah lalu memberi suara sama rata", "Umur mendominasi karena kolom pertama selalu diberi bobot lebih besar oleh algoritma", "Model gagal dilatih karena KNN menolak feature dengan rentang lebih dari sepuluh ribu"], "answer": 0, "explanation": "Jarak Euclidean menjumlahkan selisih kuadrat tiap feature. Feature dengan rentang besar menenggelamkan yang lain tanpa scaling."}, {"q": "Dalam SVM, titik data mana yang menentukan posisi batas keputusan?", "code": null, "options": ["Semua titik dengan bobot yang sama, karena SVM meminimalkan total error seperti regresi", "Titik yang paling jauh dari batas, karena mereka menentukan lebar margin maksimum", "Titik dengan nilai feature terbesar, karena mereka mendominasi perhitungan kernel", "Support vector: titik yang berada tepat di margin atau melewatinya"], "answer": 3, "explanation": "Batas SVM ditentukan oleh titik-titik terdekat ke margin. Titik lain bisa dipindah tanpa mengubah garisnya."}, {"q": "Kamu menggabungkan tiga model lewat voting, tetapi ketiganya logistic regression dengan feature yang sama. Mengapa voting hampir tidak membantu?", "code": null, "options": ["Voting hanya bekerja untuk decision tree, karena model lain tidak menghasilkan suara diskrit", "Ketiga model membuat kesalahan yang sama, jadi suara mereka tidak saling mengoreksi", "Voting membutuhkan minimal lima model supaya suara mayoritas bisa dihitung dengan sah", "Logistic regression tidak punya probabilitas sehingga soft voting tidak bisa dijalankan"], "answer": 1, "explanation": "Ensemble membantu kalau kesalahan anggotanya tidak seragam. Model yang mirip membuat kesalahan yang mirip pula."}, {"q": "Dalam bootstrap yang dipakai bagging, data train baru dibuat dengan cara apa?", "code": null, "options": ["Mengambil separuh data secara berurutan dari atas supaya tiap model melihat bagian berbeda", "Membuat data sintetis baru di antara titik-titik yang ada supaya jumlah datanya bertambah", "Mengambil sampel acak dengan pengembalian, sehingga satu baris bisa terpilih lebih dari sekali", "Mengurutkan data berdasarkan target lalu memotongnya menjadi beberapa bagian sama besar"], "answer": 2, "explanation": "Bootstrap = sampling dengan pengembalian dari data yang ada. Ada baris yang muncul berulang dan ada yang tidak terambil."}, {"q": "Apa yang membedakan boosting dari bagging?", "code": null, "options": ["Boosting melatih model paralel dari sampel acak, bagging melatih model berurutan satu per satu", "Tidak ada bedanya; keduanya nama lain untuk Random Forest dengan jumlah pohon berbeda", "Boosting hanya untuk regresi, sedangkan bagging hanya untuk klasifikasi biner", "Boosting melatih berurutan, tiap model fokus memperbaiki kesalahan sebelumnya; bagging paralel"], "answer": 3, "explanation": "Bagging mengurangi variance dengan merata-ratakan model independen; boosting mengurangi bias dengan memperbaiki kesalahan bertahap."}, {"q": "Saat melatih XGBoost dengan early stopping, AUC validation berhenti membaik di iterasi 180 dari 1000. Apa tindakan yang tepat?", "code": null, "options": ["Berhenti di sekitar iterasi 180; iterasi berikutnya cenderung overfitting atau sia-sia", "Paksa sampai 1000 iterasi, karena lebih banyak pohon selalu menghasilkan model lebih akurat", "Ulangi dengan learning rate lebih besar tanpa data validation supaya lebih cepat selesai", "Hapus data validation dan pakai seluruh data untuk melatih supaya AUC-nya naik lagi"], "answer": 0, "explanation": "Early stopping memakai data validation untuk menemukan titik berhenti sebelum model mulai menghafal data train."}, {"q": "Feature importance XGBoost menunjukkan 'status menikah' sebagai kontributor terbesar untuk prediksi penghasilan. Kesimpulan mana yang tepat?", "code": null, "options": ["Menikah menyebabkan penghasilan naik, karena model sudah mengukur pengaruhnya secara langsung", "Feature lain tidak berguna dan sebaiknya dibuang supaya model lebih sederhana dan cepat", "Feature itu paling banyak dipakai model untuk memisahkan kelas; ini bukan hubungan sebab-akibat", "Model salah karena hasilnya tidak intuitif; feature importance seharusnya menyorot pendidikan"], "answer": 2, "explanation": "Feature importance mengukur kontribusi dalam membangun pohon, bukan kausalitas."}, {"q": "Dalam satu iterasi k-means, apa yang berubah dan apa yang tetap?", "code": null, "options": ["Titik data bergerak mendekati pusat terdekat, sedangkan posisi pusat cluster tetap", "Titik data diam; keanggotaan cluster dan posisi pusat yang diperbarui", "Semuanya tetap sampai iterasi terakhir, lalu pusat dan titik dipindah bersamaan", "Jumlah titik data berubah karena outlier dibuang di setiap iterasi"], "answer": 1, "explanation": "K-means menugaskan tiap titik ke pusat terdekat, memindahkan pusat ke rata-rata anggotanya, dan mengulang sampai stabil."}, {"q": "Kamu mengelompokkan pelanggan grosir memakai kolom belanja plus kolom 'Channel' (1 = restoran, 2 = retail) yang ikut di-scaling. Silhouette tertinggi di K=2 dan clusternya hampir sama dengan Channel. Apa yang sebenarnya terjadi?", "code": null, "options": ["Clustering menemukan segmen belanja baru yang kebetulan sejalan dengan jenis pelanggan", "K=2 memang selalu paling tepat untuk data pelanggan karena hanya ada dua jenis toko", "Scaling membuat semua kolom setara, jadi hasilnya valid dan bisa langsung dilaporkan", "Kolom kategori ikut dihitung sebagai jarak, sehingga cluster hanya meniru kolom Channel"], "answer": 3, "explanation": "Kolom kategori bukan jumlah belanja; setelah scaling ia memisahkan data dengan tajam. Pakai kolom belanja saja dan simpan Channel untuk mengecek hasil."}, {"q": "Data belanja pelanggan sangat miring: beberapa pelanggan belanja puluhan kali lipat dari yang lain. Sebelum k-means, langkah apa yang membantu?", "code": null, "options": ["Transformasi log (log1p) lalu scaling, supaya jarak tidak didominasi pelanggan raksasa", "Buang semua pelanggan besar supaya sisa datanya seragam dan cluster jadi rapi", "Kalikan semua nilai dengan 100 supaya selisih antar pelanggan biasa terlihat lebih jelas", "Ubah tiap kolom belanja menjadi kategori ya/tidak supaya k-means bekerja seperti tree"], "answer": 0, "explanation": "Log menekan rentang nilai ekstrem sehingga jarak antar pelanggan biasa tetap bermakna."}, {"q": "Kamu membandingkan cuML dan scikit-learn pada 20.000 baris data. GPU ternyata lebih lambat. Penjelasan mana yang paling masuk akal?", "code": null, "options": ["GPU-nya bermasalah, karena GPU seharusnya selalu lebih cepat berapa pun ukuran datanya", "cuML memakai algoritma yang berbeda dari scikit-learn sehingga hasilnya tidak bisa dibandingkan", "Data terlalu kecil: overhead memindahkan data dan menyiapkan kernel GPU melebihi kerja hitungnya", "GPU hanya berguna untuk deep learning, bukan untuk algoritma machine learning klasik"], "answer": 2, "explanation": "GPU unggul pada operasi paralel berukuran besar. Pada data kecil, overhead transfer dan warm-up mendominasi."}, {"q": "Setelah melatih Random Forest di CPU (sklearn) dan GPU (cuML), akurasinya beda 0,001. Apa yang bisa disimpulkan?", "code": null, "options": ["GPU membuat model lebih pintar karena bisa memeriksa lebih banyak kombinasi pemisah", "GPU hanya mempercepat komputasi; selisih sekecil itu wajar dari detail perhitungan floating point", "Salah satu model pasti rusak, karena algoritma yang sama harus memberi akurasi identik", "cuML memakai data train yang berbeda karena bootstrap di GPU tidak bisa diberi random_state"], "answer": 1, "explanation": "Akselerasi GPU mengubah kecepatan, bukan kemampuan model. Selisih kecil berasal dari detail numerik."}]};
window.QUIZ = QUIZ;
const LAB = ["A","B","C","D"];
let answered = 0, correct = 0;
const total = QUIZ.questions.length;
const quizEl = document.getElementById("quiz");
QUIZ.questions.forEach((item, qi) => {
  const card = document.createElement("div"); card.className = "q";
  const num = document.createElement("div"); num.className = "num"; num.textContent = "Soal " + (qi+1);
  card.appendChild(num);
  const text = document.createElement("div"); text.className = "text"; text.textContent = item.q;
  card.appendChild(text);
  if (item.code) { const pre = document.createElement("pre"); pre.textContent = item.code; card.appendChild(pre); }
  const expl = document.createElement("div"); expl.className = "expl";
  item.options.forEach((opt, oi) => {
    const b = document.createElement("button"); b.className = "opt";
    const lab = document.createElement("span"); lab.className = "lab"; lab.textContent = LAB[oi] + ".";
    b.appendChild(lab); b.appendChild(document.createTextNode(" " + opt));
    b.onclick = () => {
      if (card.dataset.locked) return;
      card.dataset.locked = "1";
      const opts = card.querySelectorAll(".opt");
      opts.forEach(o => o.classList.add("locked"));
      opts[item.answer].classList.add("correct");
      if (oi === item.answer) { correct++; } else { b.classList.add("wrong"); }
      answered++;
      document.getElementById("answered").textContent = answered;
      document.getElementById("correct").textContent = correct;
      expl.classList.add("show");
      if (answered === total) showSummary();
    };
    card.appendChild(b);
  });
  const eb = document.createElement("b"); eb.textContent = "Penjelasan: ";
  expl.appendChild(eb); expl.appendChild(document.createTextNode(item.explanation));
  card.appendChild(expl);
  quizEl.appendChild(card);
});
function showSummary(){
  const pct = Math.round(correct/total*100);
  const s = document.getElementById("summary"); s.classList.add("show");
  document.getElementById("finalscore").textContent = "Skor: " + correct + " / " + total + " (" + pct + "%)";
  let msg = pct>=80 ? "Bagus, pemahaman kamu solid." : pct>=60 ? "Lumayan. Ulas lagi materi yang masih salah." : "Pelajari lagi modulnya, lalu coba ulangi.";
  document.getElementById("finalmsg").textContent = msg;
  s.scrollIntoView({behavior:"smooth"});
}
</script></body></html>
