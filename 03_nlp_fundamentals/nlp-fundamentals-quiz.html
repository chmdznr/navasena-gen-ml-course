<script>
const QUIZ = {"module": "03", "title": "NLP Fundamentals", "questions": [{"q": "Kenapa teks diubah ke huruf kecil sebelum dihitung frekuensinya?", "code": null, "options": ["Agar model tidak perlu mempelajari aturan kapitalisasi bahasa Indonesia yang rumit", "Agar `NLP` dan `nlp` dihitung sebagai satu kata, bukan dua dimensi fitur terpisah", "Agar ukuran berkas korpus mengecil sehingga proses tokenisasi berjalan lebih cepat", "Agar tokenizer bisa mengenali batas kalimat tanpa bantuan tanda baca apa pun lagi"], "answer": 1, "explanation": "Setiap variasi ejaan yang tidak disatukan menjadi satu kolom fitur tambahan, dan tiap kolom harus dipelajari model dari datanya sendiri. Menyatukan NLP dan nlp berarti bukti yang ada tidak terbagi. Ukuran berkas dan deteksi kalimat bukan alasannya."}, {"q": "Sebuah tim membuang seluruh stopword sebelum menganalisis sentimen ulasan. Risiko terbesarnya apa?", "code": null, "options": ["Kata `tidak` ikut terbuang, sehingga `tidak enak` dan `enak` jadi tidak terbedakan", "Jumlah token menyusut sehingga model kehilangan kemampuan mengenali topik dokumen", "Daftar stopword bahasa Indonesia belum lengkap sehingga sebagian kata umum tertinggal", "Stopword yang dibuang membuat lemmatisasi berikutnya menghasilkan bentuk dasar keliru"], "answer": 0, "explanation": "Banyak daftar stopword memuat kata negasi seperti `tidak`. Untuk analisis sentimen, membuangnya menghapus justru informasi yang paling menentukan. Stopword bukan daftar universal — isinya harus disesuaikan dengan tugasnya."}, {"q": "Apa perbedaan mendasar antara stemming dan lemmatisasi?", "code": null, "options": ["Stemming bekerja per kalimat dengan konteks, lemmatisasi bekerja per kata tanpa konteks", "Stemming hanya tersedia untuk bahasa Inggris, lemmatisasi tersedia untuk semua bahasa", "Stemming memotong imbuhan mekanis, lemmatisasi memakai kamus dan aturan morfologi", "Stemming memerlukan model neural, lemmatisasi cukup memakai pencocokan pola sederhana"], "answer": 2, "explanation": "Stemming memangkas imbuhan tanpa kamus sehingga hasilnya boleh jadi bukan kata; lemmatisasi berbasis kamus sehingga keluarannya selalu kata yang benar. Keduanya sama-sama bekerja per kata; ketersediaan bahasa bukan pembedanya."}, {"q": "Kenapa `PhraseTokenizer` dipakai sebelum analisis frekuensi kata?", "code": null, "options": ["Supaya frekuensi dihitung per kalimat, bukan per kata, sehingga hasilnya lebih stabil", "Supaya stopword bisa dikenali lebih akurat karena konteks frasanya ikut diperhitungkan", "Supaya tokenizer bisa memberi label jenis entitas pada tiap frasa yang ditemukannya", "Supaya entitas multi-kata seperti `kecerdasan buatan` tidak terpecah jadi dua token"], "answer": 3, "explanation": "Memecah `Universitas Indonesia` menjadi dua kata umum menghilangkan maknanya. PhraseTokenizer menjaga frasa nomina tetap utuh. Ia tidak memberi label jenis entitas — untuk itu diperlukan NER."}, {"q": "Sebuah kalimat sudah di-POS tagging. Pemakaian yang paling masuk akal untuk hasilnya apa?", "code": null, "options": ["Mengurutkan kata berdasarkan kelasnya agar kalimat menjadi lebih mudah dibaca oleh model", "Mengambil kata benda saja sebagai kandidat topik, karena topik jarang berupa kata sambung", "Mengganti setiap kata dengan label kelasnya supaya kosakata fitur menjadi jauh lebih kecil", "Menghapus semua kata kerja karena kata kerja tidak pernah membawa informasi topik apa pun"], "answer": 1, "explanation": "POS tag dipakai untuk menyaring. Mengambil kata benda saja adalah cara umum mencari kandidat topik. Mengurutkan ulang kata merusak kalimat, dan membuang seluruh kata kerja menghilangkan informasi tindakan yang sering berguna."}, {"q": "Notebook membuang stopword lebih dulu, baru melakukan lemmatisasi. Alasan urutan itu apa?", "code": null, "options": ["Lemmatisasi selalu gagal kalau daftar tokennya masih memuat kata umum berfrekuensi tinggi", "Membuang stopword setelah lemmatisasi akan membuat jumlah token akhir menjadi tidak stabil", "Daftar stopword berisi bentuk permukaan umum, jadi cocoknya lebih akurat sebelum diubah", "Lemmatisasi mengubah huruf besar menjadi kecil, sehingga stopword tidak lagi bisa dikenali"], "answer": 2, "explanation": "Daftar stopword `nlp-id` disusun dari bentuk kata yang lazim muncul, bukan bentuk dasarnya. Mencocokkannya sebelum lemmatisasi karena itu lebih akurat. Urutan ini pilihan yang beralasan, bukan keharusan mutlak."}, {"q": "Sepuluh kata teratas sebuah dokumen berbahasa Indonesia adalah `yang`, `di`, `dan`, `adalah`. Kesimpulan yang tepat?", "code": null, "options": ["Pembersihan teks belum dijalankan, jadi daftar itu belum memberi informasi apa pun soal isi", "Dokumen tersebut kemungkinan besar membahas topik umum yang tidak spesifik ke bidang apa pun", "Korpusnya terlalu kecil, jadi kata bermakna belum sempat muncul dengan frekuensi yang memadai", "Tokenizer yang dipakai keliru, karena tokenizer benar akan otomatis melewati kata penghubung"], "answer": 0, "explanation": "Daftar seperti itu akan muncul untuk dokumen berbahasa Indonesia apa pun karena stopword belum dibuang. Bukan sifat dokumennya, bukan pula ukuran korpus atau kesalahan tokenizer — tokenizer memang tidak bertugas menyaring stopword."}, {"q": "Kapan bar chart lebih tepat dipakai daripada word cloud untuk menyajikan frekuensi kata?", "code": null, "options": ["Saat jumlah kata unik sangat banyak, karena word cloud hanya sanggup menampilkan sedikit kata", "Saat teksnya berbahasa Indonesia, karena word cloud tidak menangani imbuhan dengan semestinya", "Saat frekuensi antar kata berdekatan, karena word cloud selalu gagal menampilkan kata langka", "Saat hasilnya dipakai untuk mengambil keputusan, karena panjang batang bisa dibandingkan"], "answer": 3, "explanation": "Mata manusia buruk membandingkan luas huruf, dan tata letak word cloud acak sehingga tidak membawa informasi. Panjang batang bisa dibandingkan dengan akurat. Word cloud tetap berguna untuk menarik perhatian, bukan untuk memutuskan."}, {"q": "Apa yang membedakan NER dari tokenisasi frasa?", "code": null, "options": ["NER bekerja pada teks berbahasa Inggris, tokenisasi frasa dirancang khusus untuk Indonesia", "NER memerlukan pembersihan teks lebih dulu, sedangkan tokenisasi frasa memakai teks mentah", "NER memberi label jenis entitas, sedangkan tokenisasi frasa hanya menyatukan kata jadi satu", "NER menghasilkan vektor makna per entitas, tokenisasi frasa menghasilkan hitungan frekuensi"], "answer": 2, "explanation": "Keduanya menemukan satuan multi-kata, tetapi hanya NER yang memberi label seperti PERSON, ORG, atau LOC. Label itulah yang membuat keluaran NER bisa langsung dipetakan ke kolom basis data."}, {"q": "Sebuah tim perlu menarik nama perusahaan dan tanggal dari ribuan dokumen kontrak berbahasa Indonesia. Pilihan yang paling tepat?", "code": null, "options": ["spaCy dengan model `en_core_web_sm`, karena model Inggris tetap akurat untuk nama diri", "Model NER berbasis IndoBERT di Hugging Face, dengan biaya unduhan besar dan butuh GPU", "Daftar kata kunci manual, karena nama perusahaan dan tanggal polanya sudah cukup baku", "TF-IDF pada seluruh dokumen, lalu ambil istilah dengan bobot tertinggi sebagai entitasnya"], "answer": 1, "explanation": "Untuk teks Indonesia, model NER yang dilatih pada bahasa Indonesia memberi akurasi terbaik, dengan biaya unduhan dan komputasi. Model Inggris tidak dilatih pada konteks Indonesia, dan TF-IDF tidak mengenali jenis entitas."}, {"q": "TextBlob mengembalikan `polarity = 0.0` untuk sebuah kalimat berbahasa Indonesia. Tafsiran yang benar?", "code": null, "options": ["Kalimat itu benar-benar netral, karena skor nol memang menandakan tidak ada muatan emosi", "Kalimat itu terlalu pendek, sehingga TextBlob belum punya cukup kata untuk menghitung skor", "Kalimatnya mengandung negasi, dan negasi selalu membuat skor polaritas kembali menjadi nol", "Tidak ada kata yang dikenali kamusnya, jadi nol di sini berarti tidak tahu, bukan netral"], "answer": 3, "explanation": "Kamus TextBlob hanya berbahasa Inggris. Kalimat Indonesia menghasilkan nol karena tidak ada kata yang dikenali, dan model tidak membedakannya dari netral sungguhan. Ini kegagalan diam yang tidak memunculkan peringatan apa pun."}, {"q": "Kenapa pendekatan leksikon kesulitan menilai kalimat `the material is not bad at all`?", "code": null, "options": ["Leksikon menjumlahkan skor kata satu per satu tanpa membaca urutan, jadi negasi mudah meleset", "Kalimat itu memuat idiom, dan idiom tidak pernah dimasukkan ke dalam kamus sentimen mana pun", "Kata `bad` punya skor sangat negatif sehingga selalu mendominasi skor akhir seluruh kalimat", "Kalimatnya terlalu panjang, dan skor leksikon menjadi tidak stabil di kalimat lebih dari lima kata"], "answer": 0, "explanation": "Leksikon menghitung skor per kata lalu menjumlahkannya, sehingga susunan kalimat tidak terbaca. Negasi berlapis dan sarkasme karena itu mudah meleset. Transformer membaca kalimat sebagai satu kesatuan."}, {"q": "Kalimat `Gw suka bgt sama teknologi NLP nih` gagal dinormalkan pipeline klasik, tetapi dikenali positif oleh IndoBERT. Penjelasannya apa?", "code": null, "options": ["Transformer menormalkan bahasa gaul ke bentuk baku lebih dulu sebelum menilai sentimennya", "Transformer dilatih dari teks nyata termasuk bahasa informal, jadi ragam itu ada di datanya", "Transformer memakai daftar kata gaul tambahan yang disediakan terpisah oleh pembuat modelnya", "Transformer mengabaikan kata yang tidak dikenal, lalu menilai dari sisa kata yang masih baku"], "answer": 1, "explanation": "Bedanya bukan kecerdasan model, melainkan asal pengetahuannya: kamus leksikon disusun dari teks baku, sedangkan transformer dilatih dari teks nyata. Tokenisasi subword juga membuat kata tak dikenal tetap terwakili sebagian."}, {"q": "Sebuah tim harus menyaring sepuluh juta ulasan berbahasa Inggris di server tanpa GPU. Pendekatan sentimen yang paling masuk akal?", "code": null, "options": ["Transformer, karena akurasinya lebih tinggi dan itu selalu lebih penting daripada kecepatan", "Transformer dengan ukuran batch sangat besar, supaya beban komputasinya tersebar lebih merata", "Leksikon, karena murah dan transparan, lalu transformer untuk kasus yang perlu diputuskan", "Leksikon saja untuk semuanya, karena transformer tidak akan pernah jalan tanpa perangkat GPU"], "answer": 2, "explanation": "Berlapis adalah pola yang lazim di produksi: leksikon menyaring murah, transformer memutuskan sisanya. Transformer tetap bisa jalan di CPU, hanya lambat, jadi menyebutnya mustahil juga tidak tepat."}, {"q": "Apa yang hilang saat sebuah dokumen diubah menjadi representasi bag-of-words?", "code": null, "options": ["Urutan kata, sehingga `not good` dan `good` memberi sinyal yang sama kepada classifier", "Frekuensi kemunculan kata, karena yang dicatat hanya ada atau tidak adanya kata tersebut", "Kata langka, karena bag-of-words hanya menyimpan kata yang paling sering muncul di korpus", "Panjang dokumen, sehingga dokumen panjang dan pendek tidak lagi bisa dibedakan modelnya"], "answer": 0, "explanation": "Bag-of-words membuang urutan kata sepenuhnya. Akibatnya negasi hilang: `not good` dan `good` menghasilkan sinyal serupa. Frekuensi bisa dipertahankan, dan pemilihan kata fitur adalah keputusan terpisah."}, {"q": "Kenapa Naive Bayes masih diajarkan meskipun akurasinya kalah dari model modern?", "code": null, "options": ["Karena asumsi kebebasan antar katanya terbukti benar untuk data teks berbahasa apa pun", "Karena ia satu-satunya algoritma yang bisa dilatih tanpa memerlukan data yang sudah dilabeli", "Karena ia menangani urutan kata dengan benar, berbeda dari model bag-of-words pada umumnya", "Karena keputusannya bisa dibaca manusia lewat daftar kata yang paling membedakan kelas"], "answer": 3, "explanation": "Nilai utamanya keterbacaan: daftar fitur informatif bisa dibawa ke rapat. Asumsi kebebasan antar kata jelas salah tetapi tetap bekerja; ia tetap butuh data berlabel dan tetap memakai bag-of-words."}, {"q": "Kosakata 2.000 kata fitur dihitung dari seluruh korpus, baru datanya dipecah train dan test. Apa yang terjadi?", "code": null, "options": ["Tidak ada masalah, karena yang dihitung hanya frekuensi kata dan bukan bobot model apa pun", "Model akan gagal dilatih, karena jumlah fitur menjadi tidak konsisten antara train dan test", "Terjadi kebocoran data: data test ikut menentukan fitur, jadi akurasinya terlalu optimistis", "Akurasi menjadi terlalu rendah, karena kata khas data test ikut mengaburkan pola data train"], "answer": 2, "explanation": "Seleksi fitur adalah langkah yang belajar dari data, jadi ia harus di-fit pada train saja. Melibatkan test membuat model mengintip sebelum diuji. Kesalahan ini tidak memunculkan error, hanya angka yang menyenangkan."}, {"q": "Sebuah classifier mencapai akurasi 94% pada data yang 95% isinya satu kelas. Kesimpulan yang tepat?", "code": null, "options": ["Model itu sangat baik, karena akurasi di atas 90% jarang tercapai pada masalah klasifikasi teks", "Model itu lebih buruk daripada menebak kelas terbanyak, yang sudah mencapai 95% tanpa model", "Akurasi tidak bisa dinilai, karena metrik akurasi memang tidak berlaku untuk data tidak seimbang", "Model itu mengalami kebocoran data, karena akurasi setinggi itu mustahil dicapai tanpa bocoran"], "answer": 1, "explanation": "Baseline kelas mayoritas di sini 95%, jadi 94% berarti model lebih buruk daripada menebak. Akurasi tetap bisa dihitung, hanya tidak boleh dibaca tanpa baseline. Angka tinggi belum tentu berarti ada kebocoran."}, {"q": "Apa peran komponen IDF dalam TF-IDF?", "code": null, "options": ["Menekan bobot kata yang muncul di banyak dokumen, menaikkan bobot kata yang jarang muncul", "Menormalkan panjang dokumen supaya dokumen panjang tidak otomatis mendapat bobot lebih besar", "Menghitung berapa kali sebuah kata muncul dalam satu dokumen yang sedang sedang diproses", "Mengelompokkan kata bermakna mirip supaya sinonim mendapat bobot yang kurang lebih setara"], "answer": 0, "explanation": "IDF menilai seberapa jarang sebuah kata di seluruh koleksi. Kata yang ada di mana-mana dapat bobot mendekati nol — mirip fungsi daftar stopword, tetapi menyesuaikan diri dengan korpusnya. Menghitung kemunculan di satu dokumen adalah tugas TF."}, {"q": "`Saya suka makan nasi goreng` dan `Aku gemar menyantap nasi goreng` mendapat skor TF-IDF rendah. Kenapa?", "code": null, "options": ["Kedua kalimat terlalu pendek, sehingga bobot TF-IDF-nya belum sempat terbentuk dengan stabil", "Kata `nasi` dan `goreng` terlalu sering muncul, sehingga bobot IDF keduanya menjadi sangat kecil", "Kedua kalimat memakai kata ganti berbeda, dan kata ganti selalu mendominasi perhitungan bobot", "TF-IDF hanya mencocokkan kata yang persis sama, jadi `suka` dan `gemar` dianggap tak terkait"], "answer": 3, "explanation": "Bagi TF-IDF, `suka` dan `gemar` adalah dua dimensi yang sama sekali tidak berhubungan. Yang tersisa untuk dicocokkan hanya `nasi` dan `goreng`. Panjang kalimat dan kata ganti bukan penyebab utamanya."}, {"q": "Sebuah model embedding menghasilkan vektor 384 angka. Apa yang benar tentang keluaran itu?", "code": null, "options": ["Panjang vektornya bergantung pada jumlah kata, jadi kalimat panjang menghasilkan vektor lebih besar", "Panjang vektornya tetap 384 berapa pun panjang kalimatnya, jadi kalimat bisa saling dibandingkan", "Tiap angka mewakili satu kata dalam kalimat, jadi kalimat maksimalnya hanya boleh 384 kata saja", "Tiap angka adalah frekuensi satu kata dari kosakata 384 kata yang dipilih model saat pelatihan"], "answer": 1, "explanation": "Keluaran embedding berdimensi tetap, tidak bergantung panjang masukan. Justru keseragaman itu yang membuat kalimat panjang dan pendek bisa dibandingkan. Angkanya bukan frekuensi kata dan tidak dipetakan satu-satu ke kata."}, {"q": "Kenapa kemiripan dua embedding diukur dengan cosine similarity, bukan jarak biasa?", "code": null, "options": ["Karena cosine similarity selalu menghasilkan angka antara nol dan satu, sehingga lebih mudah dibaca", "Karena menghitung sudut jauh lebih cepat daripada menghitung jarak pada vektor berdimensi tinggi", "Karena cosine mengukur sudut, bukan panjang, jadi dokumen panjang dan pendek adil dibandingkan", "Karena jarak biasa tidak terdefinisi untuk vektor dengan dimensi lebih dari tiga di ruang embedding"], "answer": 2, "explanation": "Panjang vektor sering mencerminkan panjang dokumen, dan kita tidak ingin itu memengaruhi kemiripan makna. Mengukur sudut membuat keduanya adil dibandingkan. Jarak Euclid tetap terdefinisi di dimensi berapa pun."}, {"q": "Query `puncak paling tinggi di Indonesia` menemukan dokumen `Gunung Kerinci adalah gunung berapi tertinggi di Indonesia`. Apa yang membuatnya mungkin?", "code": null, "options": ["Pencocokan kata dasar, karena `tinggi` dan `tertinggi` punya bentuk dasar yang sama setelah lemma", "Perluasan query otomatis, karena model menambahkan sinonim ke query sebelum pencarian dijalankan", "Pembobotan TF-IDF, karena kata `Indonesia` muncul di keduanya dan bobotnya paling tinggi di korpus", "Perbandingan vektor makna, jadi kemiripan terdeteksi meski kata yang dipakai hampir semua beda"], "answer": 3, "explanation": "Pencarian dilakukan dengan membandingkan embedding, bukan mencocokkan kata. Karena itu dokumen tanpa kata yang sama pun bisa ditemukan. Tidak ada perluasan query, dan TF-IDF justru tidak akan menemukannya."}, {"q": "Apa yang ditambahkan RAG di Modul 05 dibanding semantic search yang dibangun di modul ini?", "code": null, "options": ["Indeks FAISS agar pencarian tetap cepat di data besar, dan LLM untuk menyusun jawabannya", "Model embedding yang jauh lebih besar, sehingga kemiripan makna terdeteksi dengan lebih akurat", "Pembersihan teks yang lebih ketat, karena dokumen harus bebas stopword sebelum bisa diindeks", "Pengukuran kemiripan dengan jarak Euclid, yang lebih tepat dipakai untuk pencarian dokumen"], "answer": 0, "explanation": "Pola intinya sama: encode, bandingkan, ambil top-k. Yang bertambah adalah indeks agar pencarian tetap cepat untuk jutaan dokumen, dan LLM di ujung untuk menyusun jawaban. Ukuran model dan metrik jaraknya bukan pembeda utamanya."}, {"q": "Kenapa LLM memakai tokenisasi subword dan bukan tokenisasi per kata?", "code": null, "options": ["Karena subword membuat jumlah token satu kalimat menjadi jauh lebih sedikit daripada per kata", "Karena subword mempertahankan urutan kata, sedangkan tokenisasi per kata selalu mengabaikannya", "Karena kosakata terbatas tetap bisa menulis kata apa pun, termasuk yang belum pernah dilihat", "Karena subword secara otomatis mengembalikan tiap kata ke bentuk dasarnya seperti lemmatisasi"], "answer": 2, "explanation": "Dengan sekitar 30–50 ribu subword, model bisa menyusun kata apa pun dari potongan yang dikenal — termasuk nama, istilah baru, dan salah ketik. Jumlah tokennya justru lebih banyak, bukan lebih sedikit."}, {"q": "Kalimat Indonesia menghasilkan lebih banyak token GPT-2 daripada kalimat Inggris yang semakna. Konsekuensi praktisnya apa?", "code": null, "options": ["Kualitas jawaban model untuk bahasa Indonesia pasti lebih rendah daripada untuk bahasa Inggris", "Biaya pemakaian API menjadi lebih mahal untuk isi yang sama, karena tagihannya dihitung per token", "Kalimat Indonesia harus dipotong lebih pendek, karena batas konteks model dihitung dalam kata", "Model perlu dilatih ulang dari awal sebelum bisa memproses kalimat berbahasa Indonesia sama sekali"], "answer": 1, "explanation": "Tokenizer GPT-2 dilatih dominan pada teks Inggris sehingga kata Indonesia terpecah lebih halus. Karena API menagih per token, isi yang sama menjadi lebih mahal. Batas konteks juga dihitung dalam token, bukan kata."}, {"q": "Apa yang dilakukan `python -m cudf.pandas -m cuml.accel pipeline.py`?", "code": null, "options": ["Menerjemahkan berkas Python menjadi kode CUDA lebih dulu, lalu menjalankan hasil terjemahannya", "Menyalin seluruh isi DataFrame ke memori GPU di awal, lalu menjalankan skripnya seperti biasa", "Menjalankan skrip dua kali, sekali di CPU dan sekali di GPU, lalu membandingkan kedua hasilnya", "Mengaktifkan akselerator sebelum `import pandas` dijalankan, jadi operasinya dialihkan ke GPU"], "answer": 3, "explanation": "Akselerator harus aktif sebelum pandas diimpor, karena ia mengambil alih modulnya. Operasi yang belum didukung GPU otomatis kembali ke CPU, sehingga kodenya tidak crash. Tidak ada penerjemahan ke CUDA maupun eksekusi ganda."}, {"q": "Hasil benchmark menunjukkan cuML lebih lambat daripada scikit-learn pada dataset kecil. Pemeriksaan pertama yang paling tepat?", "code": null, "options": ["Memastikan sel warm-up jalan, karena pemanggilan CUDA pertama membayar biaya inisialisasi", "Menaikkan ukuran batch, karena GPU baru menunjukkan keunggulannya pada batch yang besar", "Mengganti tipe data menjadi float64, karena cuML memerlukan presisi ganda agar bekerja optimal", "Menambah jumlah iterasi pelatihan, karena hasil GPU baru stabil setelah banyak epoch berjalan"], "answer": 0, "explanation": "Pemanggilan CUDA pertama membayar inisialisasi context dan kompilasi kernel, dan itu bukan kecepatan komputasi sesungguhnya. Aturan emasnya: jangan pernah mengukur pemanggilan pertama. Data kecil memang bisa membuat GPU kalah, tetapi warm-up diperiksa lebih dulu."}, {"q": "Kenapa MinHash dipakai untuk mencari near-duplicate di korpus 150 ribu paragraf?", "code": null, "options": ["Karena MinHash menghitung kemiripan tiap pasangan dokumen jauh lebih cepat daripada cosine", "Karena MinHash mengurutkan dokumen berdasarkan panjangnya, sehingga duplikat pasti berdekatan", "Karena tiap dokumen diringkas jadi sidik jari, sehingga pencarian berubah jadi pengelompokan", "Karena MinHash membuang dokumen pendek lebih dulu, dan duplikat biasanya berupa teks pendek"], "answer": 2, "explanation": "Membandingkan semua pasangan berarti sekitar 11 miliar perbandingan. MinHash mengubah masalah `cari yang mirip` menjadi `kelompokkan yang sama`, dan yang kedua jauh lebih murah. Ia tidak mempercepat perbandingan pasangan satu per satu."}, {"q": "Operasi apa dari `nvtext` yang tidak punya padanan langsung di pandas?", "code": null, "options": ["`str.lower()`, karena pandas belum menyediakan konversi huruf kecil untuk kolom bertipe teks", "`str.ngrams_tokenize()`, karena pembentukan n-gram di pandas harus disusun manual dengan map", "`str.split()`, karena pandas hanya bisa memecah string berdasarkan satu karakter pemisah saja", "`str.replace()`, karena penggantian pola di pandas tidak mendukung ekspresi reguler sama sekali"], "answer": 1, "explanation": "nvtext menyediakan operasi teks yang memang lahir di GPU, termasuk pembentukan n-gram dan minhash. Di pandas, bigram harus disusun manual lewat zip dan map. Lower, split, dan replace semuanya sudah ada di pandas."}]};
window.QUIZ = QUIZ;
const LAB = ["A","B","C","D"];
let answered = 0, correct = 0;
const total = QUIZ.questions.length;
const quizEl = document.getElementById("quiz");
QUIZ.questions.forEach((item, qi) => {
  const card = document.createElement("div"); card.className = "q";
  const num = document.createElement("div"); num.className = "num"; num.textContent = "Soal " + (qi+1);
  card.appendChild(num);
  const text = document.createElement("div"); text.className = "text"; text.textContent = item.q;
  card.appendChild(text);
  if (item.code) { const pre = document.createElement("pre"); pre.textContent = item.code; card.appendChild(pre); }
  const expl = document.createElement("div"); expl.className = "expl";
  item.options.forEach((opt, oi) => {
    const b = document.createElement("button"); b.className = "opt";
    const lab = document.createElement("span"); lab.className = "lab"; lab.textContent = LAB[oi] + ".";
    b.appendChild(lab); b.appendChild(document.createTextNode(" " + opt));
    b.onclick = () => {
      if (card.dataset.locked) return;
      card.dataset.locked = "1";
      const opts = card.querySelectorAll(".opt");
      opts.forEach(o => o.classList.add("locked"));
      opts[item.answer].classList.add("correct");
      if (oi === item.answer) { correct++; } else { b.classList.add("wrong"); }
      answered++;
      document.getElementById("answered").textContent = answered;
      document.getElementById("correct").textContent = correct;
      expl.classList.add("show");
      if (answered === total) showSummary();
    };
    card.appendChild(b);
  });
  const eb = document.createElement("b"); eb.textContent = "Penjelasan: ";
  expl.appendChild(eb); expl.appendChild(document.createTextNode(item.explanation));
  card.appendChild(expl);
  quizEl.appendChild(card);
});
function showSummary(){
  const pct = Math.round(correct/total*100);
  const s = document.getElementById("summary"); s.classList.add("show");
  document.getElementById("finalscore").textContent = "Skor: " + correct + " / " + total + " (" + pct + "%)";
  let msg = pct>=80 ? "Bagus, pemahaman kamu solid." : pct>=60 ? "Lumayan. Ulas lagi materi yang masih salah." : "Pelajari lagi modulnya, lalu coba ulangi.";
  document.getElementById("finalmsg").textContent = msg;
  s.scrollIntoView({behavior:"smooth"});
}
</script></body></html>
