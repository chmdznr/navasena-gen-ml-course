const QUIZ = {"module": "02", "title": "Deep Learning Fundamentals", "questions": [{"q": "Loss training turun terus sampai epoch 30, tetapi loss validation mulai naik sejak epoch 8. Apa yang terjadi dan apa langkah yang wajar?", "code": null, "options": ["Underfitting; tambah layer dan lanjutkan sampai epoch 60 supaya loss validation ikut turun", "Overfitting sejak epoch 8; pakai early stopping atau dropout, ambil bobot epoch terbaik", "Learning rate terlalu kecil; naikkan sepuluh kali lipat agar keduanya turun bersama", "Data validation rusak; ganti dengan data test supaya kurvanya lebih halus"], "answer": 1, "explanation": "Gap yang membesar antara train dan validation adalah tanda overfitting. Early stopping/dropout menahannya; test set tidak boleh dipakai untuk memilih epoch."}, {"q": "Saat gradient descent, loss melonjak naik-turun dan akhirnya menjadi NaN. Penyebab paling mungkin?", "code": null, "options": ["Learning rate terlalu besar: langkahnya melompati dasar lembah dan meledak", "Batch size terlalu kecil sehingga gradien menjadi terlalu halus dan tidak bergerak", "Terlalu banyak epoch, model kehabisan pola baru yang bisa dipelajari dari data", "Fungsi aktivasi ReLU mematikan semua neuron sehingga loss tidak terdefinisi"], "answer": 0, "explanation": "Learning rate yang terlalu besar membuat langkah melewati minimum dan makin jauh; loss meledak. Solusinya turunkan learning rate."}, {"q": "Kamu melatih Fashion-MNIST dengan 60.000 gambar dan batch size 64. Apa arti 'satu epoch'?", "code": null, "options": ["Satu kali pembaruan bobot memakai 64 gambar yang dipilih acak dari data train", "Satu kali evaluasi model pada data validation setelah bobot diperbarui", "Satu putaran penuh melewati seluruh 60.000 gambar train, sekitar 938 pembaruan bobot", "Satu detik waktu training, berapa pun jumlah gambar yang sempat diproses"], "answer": 2, "explanation": "Epoch = seluruh data train dilewati sekali; dengan batch 64 itu berarti 60.000/64 ≈ 938 langkah pembaruan."}, {"q": "Kamu membandingkan tiga arsitektur (kecil, sedang, besar) dan mau memilih satu untuk dilaporkan. Cara mana yang tidak mencemari angka akhir?", "code": null, "options": ["Latih ketiganya, ukur di data test, pilih yang tertinggi, laporkan angka test itu", "Pilih yang paling besar karena kapasitas lebih tinggi hampir pasti lebih akurat", "Pilih yang paling kecil supaya training cepat, lalu laporkan akurasi trainnya", "Latih ketiganya, bandingkan di data validation, ukur pemenangnya sekali di data test"], "answer": 3, "explanation": "Test set hanya dipakai sekali untuk model yang sudah dipilih; kalau dipakai memilih, skornya terlalu optimistis."}, {"q": "Mengapa piksel gambar dibagi 255 sebelum masuk ke neural network?", "code": null, "options": ["Supaya file gambar menjadi lebih kecil dan proses membaca data dari disk lebih cepat", "Supaya masukan berada di rentang 0–1 dan gradient descent lebih stabil", "Karena Keras menolak masukan bertipe integer dan hanya menerima nilai di bawah satu", "Supaya gambar menjadi hitam-putih dan jumlah kelas keluaran ikut berkurang"], "answer": 1, "explanation": "Normalisasi input menyamakan skala masukan sehingga bobot awal dan learning rate bekerja dengan baik."}, {"q": "Apa yang sebenarnya dilakukan backpropagation?", "code": null, "options": ["Menjalankan data dari belakang ke depan supaya model membaca gambar secara terbalik", "Menghapus neuron yang salah memprediksi dan menggantinya dengan neuron baru yang acak", "Menghitung andil tiap bobot pada error, diteruskan dari output ke layer awal", "Mengulang epoch terakhir dengan learning rate lebih kecil sampai loss berhenti berubah"], "answer": 2, "explanation": "Backprop mendistribusikan error keluaran ke setiap bobot lewat turunan berantai; gradient descent lalu memperbarui bobotnya."}, {"q": "Model 10 kelas mencapai akurasi test 87%. Confusion matrix menunjukkan Coat dan Pullover paling sering saling tertukar. Kesimpulan mana yang tepat?", "code": null, "options": ["Kesalahan menumpuk di dua kelas yang memang mirip; akurasi total menyembunyikannya", "Model rusak karena akurasi di bawah 90% tidak layak untuk klasifikasi gambar", "Kelas Coat harus dihapus dari data supaya akurasi keseluruhan naik ke angka sempurna", "Confusion matrix tidak relevan untuk 10 kelas dan hanya berlaku untuk klasifikasi biner"], "answer": 0, "explanation": "Confusion matrix menunjukkan di mana model salah; kelas yang secara visual mirip wajar tertukar dan itu informasi untuk perbaikan."}, {"q": "Dropout 0,5 dipasang di layer tersembunyi. Apa yang terjadi saat training dan saat prediksi?", "code": null, "options": ["Saat training semua neuron aktif; saat prediksi separuh neuron dimatikan supaya lebih cepat", "Separuh data train dibuang permanen supaya model tidak menghafal contoh yang sama", "Separuh bobot dibulatkan ke nol setelah training selesai agar model lebih kecil", "Saat training separuh neuron dimatikan acak; saat prediksi semua aktif"], "answer": 3, "explanation": "Dropout hanya aktif saat training: neuron dimatikan acak agar model tidak bergantung pada jalur tertentu. Saat inferensi semua neuron dipakai."}, {"q": "Kamu menumpuk lima layer Dense tanpa fungsi aktivasi. Apa kemampuan model ini?", "code": null, "options": ["Lima kali lebih kuat dari satu layer karena setiap layer menambah pola baru yang bisa ditangkap", "Bisa memisahkan pola apa pun asalkan jumlah neuron per layer cukup besar", "Setara satu layer linear: tumpukan transformasi linear tetap linear", "Tidak bisa dilatih sama sekali karena gradient descent membutuhkan fungsi aktivasi"], "answer": 2, "explanation": "Tanpa nonlinearitas, komposisi layer linear tetap linear. Aktivasi seperti ReLU yang memberi kemampuan memodelkan pola melengkung."}, {"q": "Network 20 layer dengan aktivasi sigmoid di semua layer belajar sangat lambat; bobot layer awal hampir tidak berubah. Apa penyebabnya?", "code": null, "options": ["Exploding gradient: sigmoid memperbesar gradien setiap layer sehingga bobot awal menjadi tak terhingga", "Vanishing gradient: turunan sigmoid ≤ 0,25, dikalikan berulang jadi hampir nol", "Data terlalu kecil untuk 20 layer, jadi bobot awal tidak pernah menerima contoh yang cukup", "Sigmoid hanya bekerja pada layer keluaran, sehingga layer tengah diabaikan oleh optimizer"], "answer": 1, "explanation": "Turunan sigmoid kecil; perkalian berantai lewat banyak layer membuat gradien di layer awal menyusut. ReLU mengurangi masalah ini."}, {"q": "Layer keluaran untuk klasifikasi 10 kelas memakai softmax. Apa yang dijamin softmax pada keluarannya?", "code": null, "options": ["Sepuluh nilai yang masing-masing bisa negatif atau positif, mencerminkan skor mentah tiap kelas", "Satu nilai antara 0 dan 1 yang menyatakan peluang gambar termasuk kelas pertama", "Sepuluh nilai biner 0 atau 1, satu untuk tiap kelas, tanpa informasi keyakinan", "Sepuluh nilai 0–1 yang berjumlah tepat 1, bisa dibaca sebagai probabilitas kelas"], "answer": 3, "explanation": "Softmax menormalkan skor menjadi distribusi probabilitas atas semua kelas; kelas dengan nilai terbesar menjadi prediksi."}, {"q": "Apa perbedaan praktis Adam dibanding SGD biasa?", "code": null, "options": ["Adam menyesuaikan besar langkah tiap parameter dari riwayat gradien, konvergen lebih cepat", "Adam memakai learning rate yang jauh lebih besar sehingga selalu mencapai loss lebih rendah di akhir", "Adam mengubah arsitektur model dengan menambah neuron secara otomatis saat loss stagnan", "Adam hanya berfungsi untuk gambar, sedangkan SGD untuk data tabular dan teks"], "answer": 0, "explanation": "Adam mengombinasikan momentum dan penyesuaian skala per parameter; itu membuatnya andal sebagai pilihan awal, bukan jaminan hasil terbaik."}, {"q": "Mengapa CNN memakai filter kecil (misalnya 3×3) yang digeser ke seluruh gambar, bukan Dense yang terhubung ke semua piksel?", "code": null, "options": ["Karena gambar tidak bisa diratakan menjadi vektor, sehingga Dense secara teknis tidak bisa menerima piksel", "Filter yang sama dipakai di semua posisi: parameter sedikit, pola lokal terdeteksi di mana pun", "Karena filter 3×3 melihat seluruh gambar sekaligus sehingga konteks globalnya lebih lengkap dari Dense", "Karena Dense hanya bekerja pada gambar hitam-putih, sedangkan konvolusi mendukung warna"], "answer": 1, "explanation": "Konvolusi berbagi bobot antar posisi (translation invariance) dan hanya melihat tetangga lokal; itu hemat parameter dan cocok untuk gambar."}, {"q": "Apa yang ditunjukkan sebuah feature map di layer konvolusi pertama?", "code": null, "options": ["Probabilitas tiap kelas untuk gambar itu sebelum melewati layer softmax di akhir", "Salinan gambar asli yang sudah dinormalisasi dan diperkecil ke ukuran 3×3 piksel", "Peta respons satu filter di tiap posisi gambar, misalnya tepi vertikal atau horizontal", "Daftar bobot layer Dense terakhir yang diurutkan dari yang paling berpengaruh"], "answer": 2, "explanation": "Feature map adalah keluaran satu filter; di layer awal biasanya berupa detektor tepi, tekstur, atau warna sederhana."}, {"q": "Apa fungsi pooling (misalnya max pooling 2×2) di CNN?", "code": null, "options": ["Mengecilkan feature map dan membuat deteksi tahan pergeseran kecil, ambil nilai terbesar tiap blok", "Menggandakan ukuran feature map supaya detail halus gambar tidak hilang di layer berikutnya", "Mengubah gambar berwarna menjadi hitam-putih supaya jumlah channel berkurang menjadi satu", "Menormalkan nilai piksel ke rentang 0–1 sebelum masuk ke layer konvolusi berikutnya"], "answer": 0, "explanation": "Pooling merangkum blok kecil menjadi satu nilai; ukuran turun, komputasi hemat, dan posisi persis fitur menjadi kurang penting."}, {"q": "Kamu punya 5.000 foto produk dan ingin classifier gambar yang bagus dalam satu sore. Pendekatan mana yang paling masuk akal?", "code": null, "options": ["Latih CNN dari nol dengan 50 layer, karena arsitektur dalam pasti mengalahkan model pre-trained", "Pakai Dense besar tanpa konvolusi supaya semua piksel diperhitungkan tanpa kehilangan detail", "Kumpulkan dulu satu juta foto tambahan, karena CNN tidak bisa belajar dari data sebanyak itu", "Transfer learning: backbone pre-trained ImageNet dibekukan, latih layer atas dengan datamu"], "answer": 3, "explanation": "Dengan data terbatas, fitur umum dari ImageNet (tepi, tekstur, bentuk) bisa dipakai ulang; hanya kepala classifier yang dilatih."}, {"q": "ResNet50 pre-trained ImageNet dipakai untuk CIFAR-10 berukuran 32×32 dan hasilnya tidak sebaik yang diharapkan. Penjelasan mana yang paling masuk akal?", "code": null, "options": ["ResNet50 hanya bisa mengenali 1.000 kelas ImageNet dan menolak dataset dengan 10 kelas", "Transfer learning selalu lebih buruk dari CNN dari nol pada dataset yang lebih kecil dari ImageNet", "Fitur ImageNet dipelajari dari gambar ±224×224; di 32×32 detail yang dikenali backbone hampir tak ada", "CIFAR-10 adalah gambar hitam-putih sehingga tiga channel warna ResNet tidak terpakai"], "answer": 2, "explanation": "Kecocokan resolusi dan domain menentukan manfaat transfer learning; gambar sangat kecil membuat fitur pre-trained kurang relevan."}, {"q": "Augmentasi seperti RandomFlip dan RandomRotation dipasang sebagai layer di dalam model. Apa efeknya saat training dan saat prediksi?", "code": null, "options": ["Saat training gambar tetap asli; saat prediksi gambar diputar acak supaya model diuji lebih keras", "Saat training tiap batch melihat variasi acak; saat prediksi layer ini tidak mengubah gambar", "Jumlah gambar di disk bertambah dua kali lipat karena setiap gambar disimpan versi terbaliknya", "Model menjadi lebih kecil karena gambar yang mirip digabung menjadi satu contoh"], "answer": 1, "explanation": "Layer augmentasi Keras aktif hanya saat training, menghasilkan variasi on-the-fly tanpa menambah file; saat inferensi ia pass-through."}, {"q": "Apa yang dibawa 'hidden state' pada RNN dari satu langkah waktu ke langkah berikutnya?", "code": null, "options": ["Ringkasan masukan sebelumnya, sehingga prediksi kini bergantung pada konteks yang lewat", "Salinan persis seluruh masukan sebelumnya, sehingga memori yang dibutuhkan tumbuh seiring panjang urutan", "Label jawaban benar dari langkah sebelumnya, supaya model bisa mengoreksi dirinya sendiri", "Learning rate yang menyesuaikan diri di tiap langkah waktu berdasarkan error terakhir"], "answer": 0, "explanation": "Hidden state adalah memori ringkas berukuran tetap yang diperbarui tiap langkah; itu yang membedakan RNN dari Dense biasa."}, {"q": "SimpleRNN gagal menangkap hubungan antara kata pertama dan kata ke-80 dalam sebuah ulasan. Mengapa, dan apa yang membantu?", "code": null, "options": ["Ulasan terlalu pendek untuk RNN; tambahkan padding sampai 1.000 token supaya konteksnya cukup", "SimpleRNN hanya membaca kata terakhir; ganti dengan Dense yang membaca semua kata sekaligus", "Learning rate terlalu besar; kecilkan sepuluh kali supaya kata pertama tidak terlupakan", "Gradien menyusut lewat puluhan langkah (vanishing); gerbang LSTM/GRU menjaga info lebih lama"], "answer": 3, "explanation": "Di urutan panjang gradien RNN biasa menghilang; gerbang LSTM/GRU mengatur apa yang disimpan dan dilupakan sehingga konteks jauh bisa bertahan."}, {"q": "Apa peran layer Embedding pada model teks?", "code": null, "options": ["Menghapus kata-kata umum seperti 'dan' dan 'yang' supaya model fokus pada kata penting", "Mengubah indeks kata menjadi vektor padat yang dipelajari; kata bermakna serupa berdekatan", "Menerjemahkan ulasan ke bahasa Inggris sebelum diproses oleh LSTM", "Mengurutkan kata berdasarkan frekuensi lalu membuang yang jarang muncul"], "answer": 1, "explanation": "Embedding memetakan tiap token ke vektor kontinu yang ikut dilatih; itu representasi masukan untuk RNN/LSTM."}, {"q": "Untuk memprediksi nilai deret waktu berikutnya, baseline paling sederhana yang wajar dibandingkan dengan RNN adalah?", "code": null, "options": ["Memprediksi nol untuk semua langkah supaya error mudah dihitung", "Memakai rata-rata seluruh deret termasuk data masa depan yang belum terjadi", "Memprediksi bahwa nilai berikutnya sama dengan nilai terakhir yang diketahui", "Menjalankan LSTM dengan satu neuron dan menyebutnya baseline"], "answer": 2, "explanation": "Baseline 'nilai terakhir' (naive) sering mengejutkan kuatnya; RNN layak dipakai kalau mengalahkannya."}, {"q": "Mengapa training deep learning cocok untuk GPU?", "code": null, "options": ["GPU punya memori jauh lebih besar dari RAM sehingga seluruh dataset bisa dimuat sekaligus", "GPU menjalankan Python lebih cepat sehingga loop training per epoch lebih singkat", "GPU menghitung gradien secara simbolik sehingga backprop tidak perlu dilakukan", "Kerjanya didominasi perkalian matriks besar yang bisa dipecah jadi ribuan operasi paralel"], "answer": 3, "explanation": "Matmul dan konvolusi adalah operasi paralel masif; ribuan core GPU mengerjakannya bersamaan."}, {"q": "Model kecil (dua layer Dense, batch 32, data 1.000 baris) dilatih di GPU ternyata tidak lebih cepat dari CPU. Penjelasan yang tepat?", "code": null, "options": ["Kerja per langkah terlalu kecil; overhead pindah data dan kernel GPU melebihi hitungannya", "GPU Colab sedang rusak, karena GPU seharusnya selalu lebih cepat untuk model apa pun", "TensorFlow tidak mendukung GPU untuk layer Dense, hanya untuk konvolusi", "Batch 32 terlalu besar untuk GPU sehingga harus dipecah menjadi batch 1"], "answer": 0, "explanation": "Keuntungan GPU muncul saat pekerjaannya besar; pada model kecil overhead mendominasi dan CPU bisa setara atau lebih cepat."}, {"q": "Mixed precision (FP16 untuk sebagian komputasi) dipakai saat training. Apa manfaat dan syaratnya?", "code": null, "options": ["Model menjadi dua kali lebih akurat karena angka dihitung dengan dua presisi sekaligus", "Semua bobot menjadi integer sehingga model bisa dijalankan di mikrokontroler", "Lebih cepat dan hemat memori di GPU ber-FP16; layer keluaran tetap float32 demi stabilitas", "Training menjadi deterministik sehingga hasil selalu identik di setiap run"], "answer": 2, "explanation": "FP16 mempercepat matmul di Tensor Core dan mengecilkan memori; keluaran dan loss dijaga float32 demi stabilitas numerik."}, {"q": "Kapan mengubah model Keras menjadi engine TensorRT (lewat ONNX) layak dilakukan?", "code": null, "options": ["Saat masih bereksperimen dengan arsitektur, supaya tiap percobaan training lebih cepat", "Saat model final akan melayani banyak inferensi di GPU NVIDIA dan latensi per prediksi penting", "Saat data train bertambah, karena TensorRT melatih ulang model secara otomatis di GPU", "Saat model akan dijalankan di laptop tanpa GPU, karena TensorRT mengganti CPU menjadi GPU virtual"], "answer": 1, "explanation": "TensorRT mengoptimasi inferensi (fusi layer, presisi rendah) untuk model yang sudah dilatih; ia bukan alat training dan butuh GPU NVIDIA."}, {"q": "Apa perbedaan mendasar model diskriminatif dan generatif?", "code": null, "options": ["Diskriminatif bekerja pada gambar, generatif hanya pada teks dan suara", "Diskriminatif dilatih tanpa label, generatif membutuhkan label untuk setiap contoh", "Diskriminatif selalu lebih besar dan lebih lambat daripada model generatif", "Diskriminatif memetakan masukan ke label; generatif mempelajari sebaran data dan membuat contoh baru"], "answer": 3, "explanation": "Classifier menjawab 'kelas apa'; model generatif memodelkan bagaimana data terbentuk sehingga bisa membuat sampel baru."}, {"q": "Autoencoder dilatih merekonstruksi digit MNIST lewat bottleneck 2 dimensi. Apa arti 'latent space' di sini?", "code": null, "options": ["Ruang 2 dimensi ringkasan tiap gambar; titik berdekatan didekode menjadi digit yang mirip", "Daftar 784 piksel asli yang disimpan ulang tanpa perubahan di tengah model", "Label 0–9 yang disisipkan ke model supaya rekonstruksinya lebih akurat", "Learning rate dan batch size yang dipelajari otomatis oleh encoder"], "answer": 0, "explanation": "Latent space adalah representasi terkompresi; interpolasi antar titik di ruang ini menghasilkan transisi halus antar digit."}, {"q": "Dalam GAN, generator dan discriminator dilatih bersama. Apa peran masing-masing?", "code": null, "options": ["Generator memberi label pada gambar; discriminator menghapus gambar yang labelnya salah", "Generator dan discriminator adalah dua salinan model yang sama, dilatih pada data berbeda lalu dirata-rata", "Generator membuat gambar palsu dari noise; discriminator menebak asli/palsu dan menjadi sinyal belajar", "Generator mengompresi gambar; discriminator mendekompresinya kembali menjadi gambar asli"], "answer": 2, "explanation": "Dua pemain berlawanan: generator berusaha menipu, discriminator berusaha membedakan; keseimbangannya yang menghasilkan gambar realistis."}, {"q": "Setelah 15 epoch, DCGAN menghasilkan digit yang semuanya terlihat seperti angka 1. Fenomena ini disebut apa?", "code": null, "options": ["Overfitting discriminator: discriminator menghafal data train sehingga generator tidak bisa belajar apa pun", "Mode collapse: generator menemukan satu keluaran yang menipu discriminator dan berhenti bervariasi", "Vanishing gradient pada decoder: gradien tidak sampai ke layer awal generator sehingga keluarannya seragam", "Konvergensi sempurna: GAN memang seharusnya menghasilkan satu digit terbaik setelah cukup epoch"], "answer": 1, "explanation": "Mode collapse adalah kegagalan khas GAN: keragaman keluaran hilang meski discriminator tertipu."}]};

  card.appendChild(text);
  if (item.code) { const pre = document.createElement("pre"); pre.textContent = item.code; card.appendChild(pre); }
  const expl = document.createElement("div"); expl.className = "expl";
  item.options.forEach((opt, oi) => {
    const b = document.createElement("button"); b.className = "opt";
    const lab = document.createElement("span"); lab.className = "lab"; lab.textContent = LAB[oi] + ".";
    b.appendChild(lab); b.appendChild(document.createTextNode(" " + opt));
    b.onclick = () => {
      if (card.dataset.locked) return;
      card.dataset.locked = "1";
      const opts = card.querySelectorAll(".opt");
      opts.forEach(o => o.classList.add("locked"));
      opts[item.answer].classList.add("correct");
      if (oi === item.answer) { correct++; } else { b.classList.add("wrong"); }
      answered++;
      document.getElementById("answered").textContent = answered;
      document.getElementById("correct").textContent = correct;
      expl.classList.add("show");
      if (answered === total) showSummary();
    };
    card.appendChild(b);
  });
  const eb = document.createElement("b"); eb.textContent = "Penjelasan: ";
  expl.appendChild(eb); expl.appendChild(document.createTextNode(item.explanation));
  card.appendChild(expl);
  quizEl.appendChild(card);
});
function showSummary(){
  const pct = Math.round(correct/total*100);
  const s = document.getElementById("summary"); s.classList.add("show");
  document.getElementById("finalscore").textContent = "Skor: " + correct + " / " + total + " (" + pct + "%)";
  let msg = pct>=80 ? "Bagus, pemahaman kamu solid." : pct>=60 ? "Lumayan. Ulas lagi materi yang masih salah." : "Pelajari lagi modulnya, lalu coba ulangi.";
  document.getElementById("finalmsg").textContent = msg;
  s.scrollIntoView({behavior:"smooth"});
}
</script></body></html>
